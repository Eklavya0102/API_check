<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LLM Key Checker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #161618;
      --surface2: #1e1e22;
      --border: #2a2a30;
      --border2: #3a3a42;
      --text: #e8e8ec;
      --muted: #6e6e7a;
      --accent: #7c6af7;
      --green: #22c55e;
      --green-dim: #14532d;
      --red: #f87171;
      --red-dim: #450a0a;
      --yellow: #fbbf24;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Syne', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; padding: 2rem 1rem 4rem; }
    .page { max-width: 780px; margin: 0 auto; }

    header { margin-bottom: 2.5rem; }
    header h1 {
      font-size: 2rem; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #e8e8ec 0%, #7c6af7 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    header p { color: var(--muted); font-size: 0.9rem; margin-top: 6px; font-family: var(--mono); }

    .top-bar { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .btn-check-all {
      flex: 1; min-width: 200px; padding: 10px 20px;
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      font-family: var(--sans); font-size: .9rem; font-weight: 600; cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn-check-all:hover { opacity: .85; }
    .btn-check-all:active { transform: scale(.98); }
    .btn-clear {
      padding: 10px 16px; background: var(--surface2); color: var(--muted);
      border: 1px solid var(--border); border-radius: 8px; font-family: var(--sans);
      font-size: .85rem; cursor: pointer; transition: background .15s, color .15s;
    }
    .btn-clear:hover { background: var(--border); color: var(--text); }

    .summary-bar { display: flex; gap: 12px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .summary-chip {
      font-family: var(--mono); font-size: 12px; padding: 4px 12px;
      border-radius: 20px; border: 1px solid var(--border); color: var(--muted); background: var(--surface);
    }
    .summary-chip.s-valid   { color: var(--green);  border-color: var(--green-dim); background: #0d2e1a; }
    .summary-chip.s-invalid { color: var(--red);    border-color: var(--red-dim);   background: #2a0d0d; }

    .section-label {
      font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); margin: 1.5rem 0 .75rem; padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }

    .provider-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 1rem 1.1rem; margin-bottom: 10px; transition: border-color .2s;
    }
    .provider-card:hover { border-color: var(--border2); }
    .provider-card.state-valid   { border-color: #166534; }
    .provider-card.state-invalid { border-color: #7f1d1d; }
    .provider-card.state-warn    { border-color: #854d0e; }

    .card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .badge {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 10px; font-weight: 500; flex-shrink: 0; letter-spacing: .03em;
    }
    .pname { font-size: 14px; font-weight: 600; color: var(--text); }

    /* ── model selector ── */
    .model-row { margin-bottom: 8px; position: relative; }
    .model-trigger {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
      padding: 3px 8px 3px 10px; cursor: pointer; transition: border-color .15s, background .15s;
      font-family: var(--mono); font-size: 11px; color: var(--muted); user-select: none;
    }
    .model-trigger:hover { border-color: var(--border2); color: var(--text); background: var(--border); }
    .model-trigger .model-label { color: var(--accent); font-size: 11px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .model-trigger .chevron { font-size: 10px; transition: transform .15s; }
    .model-trigger.open .chevron { transform: rotate(180deg); }

    .model-dropdown {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 100;
      background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px;
      min-width: 280px; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
      overflow: hidden;
    }
    .model-dropdown.open { display: block; }

    .dropdown-list { max-height: 220px; overflow-y: auto; padding: 6px; }
    .dropdown-list::-webkit-scrollbar { width: 4px; }
    .dropdown-list::-webkit-scrollbar-track { background: transparent; }
    .dropdown-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .model-opt {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; border-radius: 6px; cursor: pointer;
      font-family: var(--mono); font-size: 11px; color: var(--text);
      transition: background .1s; gap: 8px;
    }
    .model-opt:hover { background: var(--border); }
    .model-opt.selected { background: #2a2060; color: var(--accent); }
    .model-opt .opt-tag {
      font-size: 9px; padding: 1px 6px; border-radius: 3px;
      background: var(--border); color: var(--muted); white-space: nowrap; flex-shrink: 0;
    }
    .model-opt.selected .opt-tag { background: #3d3480; color: var(--accent); }

    .dropdown-divider { height: 1px; background: var(--border); margin: 4px 6px; }

    .custom-model-row {
      padding: 8px;
      display: flex; gap: 6px; align-items: center;
    }
    .custom-model-input {
      flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 8px; font-family: var(--mono); font-size: 11px; color: var(--text);
      outline: none; transition: border-color .15s;
    }
    .custom-model-input:focus { border-color: var(--accent); }
    .custom-model-input::placeholder { color: var(--muted); }
    .btn-use-custom {
      padding: 6px 10px; background: var(--accent); border: none; border-radius: 6px;
      font-family: var(--sans); font-size: 11px; font-weight: 600; color: #fff;
      cursor: pointer; white-space: nowrap; transition: opacity .15s;
    }
    .btn-use-custom:hover { opacity: .85; }

    /* ── key row ── */
    .card-body { display: flex; gap: 8px; align-items: center; }
    .key-input {
      flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font-family: var(--mono); font-size: 12px; color: var(--text);
      outline: none; transition: border-color .15s;
    }
    .key-input:focus { border-color: var(--accent); }
    .key-input::placeholder { color: var(--muted); }
    .btn-vis {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; color: var(--muted); font-size: 14px; transition: background .15s, color .15s;
    }
    .btn-vis:hover { background: var(--border); color: var(--text); }
    .btn-check {
      background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px;
      padding: 0 14px; height: 34px; font-family: var(--sans); font-size: 12px; font-weight: 600;
      color: var(--text); cursor: pointer; white-space: nowrap; transition: background .15s; flex-shrink: 0;
    }
    .btn-check:hover { background: var(--border2); }
    .btn-check:disabled { opacity: .4; cursor: not-allowed; }

    /* ── status ── */
    .card-status {
      margin-top: 8px; font-size: 12px; font-family: var(--mono);
      display: flex; align-items: flex-start; gap: 6px; min-height: 18px; line-height: 1.5;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .card-status.st-valid   .status-dot { background: var(--green); }
    .card-status.st-invalid .status-dot { background: var(--red); }
    .card-status.st-warn    .status-dot { background: var(--yellow); }
    .card-status.st-checking .status-dot { background: var(--accent); animation: pulse 1s infinite; }
    .card-status.st-valid    .status-text { color: var(--green); }
    .card-status.st-invalid  .status-text { color: var(--red); }
    .card-status.st-warn     .status-text { color: var(--yellow); }
    .card-status.st-checking .status-text { color: var(--muted); }
    .latency { margin-left: auto; font-size: 10px; color: var(--muted); white-space: nowrap; }
    .detail-text {
      margin-top: 4px; font-size: 11px; font-family: var(--mono); color: var(--muted);
      background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px; overflow: auto; max-height: 80px; white-space: pre-wrap; word-break: break-all;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    footer { margin-top: 3rem; font-size: 11px; color: var(--muted); font-family: var(--mono); text-align: center; }
  </style>
</head>
<body>
<div class="page">
  <header>
    <h1>LLM Key Checker</h1>
    <p>// validate api keys · select or type any model · 11 providers</p>
  </header>

  <div class="top-bar">
    <button class="btn-check-all" onclick="checkAll()">⚡ Check all filled keys</button>
    <button class="btn-clear" onclick="clearAll()">✕ Clear all</button>
  </div>

  <div class="summary-bar" id="summary" style="display:none">
    <span class="summary-chip s-valid"   id="sum-valid">0 valid</span>
    <span class="summary-chip s-invalid" id="sum-invalid">0 invalid</span>
    <span class="summary-chip"           id="sum-waiting">0 unchecked</span>
  </div>

  <div id="cards"></div>
  <footer>keys are sent only to their respective provider apis · not stored anywhere</footer>
</div>

<script>
const PROVIDERS = [
  {
    id:"openai", name:"OpenAI", placeholder:"sk-...", color:"#10a37f", bg:"#0a2e1f", label:"OAI", group:"Major",
    defaultModel:"gpt-4o-mini",
    models:[
      {id:"gpt-4o",             label:"GPT-4o",             tag:"latest"},
      {id:"gpt-4o-mini",        label:"GPT-4o mini",        tag:"fast"},
      {id:"gpt-4-turbo",        label:"GPT-4 Turbo",        tag:"powerful"},
      {id:"gpt-3.5-turbo",      label:"GPT-3.5 Turbo",      tag:"cheap"},
      {id:"o1",                 label:"o1",                 tag:"reasoning"},
      {id:"o3-mini",            label:"o3 mini",            tag:"reasoning"},
    ]
  },
  {
    id:"anthropic", name:"Anthropic", placeholder:"sk-ant-...", color:"#c96442", bg:"#2e1a12", label:"ANT", group:"Major",
    defaultModel:"claude-haiku-4-5-20251001",
    models:[
      {id:"claude-opus-4-6",           label:"Claude Opus 4.6",     tag:"powerful"},

      {id:"claude-haiku-4-5-20251001", label:"Claude Haiku 4.5",    tag:"fast"},
      {id:"claude-3-5-sonnet-20241022",label:"Claude 3.5 Sonnet",   tag:"prev"},
      {id:"claude-3-opus-20240229",    label:"Claude 3 Opus",       tag:"prev"},

  },
  {
    id:"gemini", name:"Google Gemini", placeholder:"AIza...", color:"#4285f4", bg:"#0d1e3d", label:"GEM", group:"Major",
    defaultModel:"gemini-2.0-flash",
    models:[
      {id:"gemini-2.5-pro",      label:"Gemini 2.5 Pro",     tag:"powerful"},
      {id:"gemini-2.0-flash",    label:"Gemini 2.0 Flash",   tag:"fast"},
      {id:"gemini-1.5-pro",      label:"Gemini 1.5 Pro",     tag:"prev"},
      {id:"gemini-1.5-flash",    label:"Gemini 1.5 Flash",   tag:"prev"},
    ]
  },
  {
    id:"mistral", name:"Mistral AI", placeholder:"...", color:"#ff7000", bg:"#2e1a00", label:"MIS", group:"Major",
    defaultModel:"mistral-small-latest",
    models:[
      {id:"mistral-large-latest",  label:"Mistral Large",    tag:"powerful"},
      {id:"mistral-medium-latest", label:"Mistral Medium",   tag:"balanced"},
      {id:"mistral-small-latest",  label:"Mistral Small",    tag:"fast"},
      {id:"codestral-latest",      label:"Codestral",        tag:"code"},
      {id:"open-mixtral-8x22b",    label:"Mixtral 8x22B",    tag:"open"},
    ]
  },
  {
    id:"groq", name:"Groq", placeholder:"gsk_...", color:"#f55036", bg:"#2e0e08", label:"GRQ", group:"Major",
    defaultModel:"llama-3.3-70b-versatile",
    models:[
      {id:"llama-3.3-70b-versatile",    label:"Llama 3.3 70B",       tag:"best"},
      {id:"llama-3.1-8b-instant",       label:"Llama 3.1 8B Instant",tag:"fast"},
      {id:"mixtral-8x7b-32768",         label:"Mixtral 8x7B",        tag:""},
      {id:"gemma2-9b-it",               label:"Gemma 2 9B",          tag:""},
      {id:"deepseek-r1-distill-llama-70b",label:"DeepSeek R1 70B",   tag:"reasoning"},
    ]
  },
  {
    id:"xai", name:"xAI (Grok)", placeholder:"xai-...", color:"#1d9bf0", bg:"#0a1e2e", label:"XAI", group:"Major",
    defaultModel:"grok-3",
    models:[
      {id:"grok-3",        label:"Grok 3",         tag:"latest"},
      {id:"grok-3-mini",   label:"Grok 3 mini",    tag:"fast"},
      {id:"grok-2",        label:"Grok 2",         tag:"prev"},
      {id:"grok-beta",     label:"Grok Beta",      tag:""},
    ]
  },
  {
    id:"deepseek", name:"DeepSeek", placeholder:"sk-...", color:"#6366f1", bg:"#16163d", label:"DSK", group:"Major",
    defaultModel:"deepseek-chat",
    models:[
      {id:"deepseek-chat",      label:"DeepSeek Chat (V3)", tag:"fast"},
      {id:"deepseek-reasoner",  label:"DeepSeek R1",        tag:"reasoning"},
    ]
  },
  {
    id:"cohere", name:"Cohere", placeholder:"...", color:"#39594d", bg:"#0d1e18", label:"COH", group:"Other",
    defaultModel:"command-r-plus",
    models:[
      {id:"command-r-plus",  label:"Command R+",  tag:"powerful"},
      {id:"command-r",       label:"Command R",   tag:"balanced"},
      {id:"command-light",   label:"Command Light",tag:"fast"},
    ]
  },
  {
    id:"together", name:"Together AI", placeholder:"...", color:"#0ea5e9", bg:"#0a1e2e", label:"TOG", group:"Other",
    defaultModel:"meta-llama/Llama-3-70b-chat-hf",
    models:[
      {id:"meta-llama/Llama-3-70b-chat-hf",   label:"Llama 3 70B",      tag:""},
      {id:"meta-llama/Llama-3-8b-chat-hf",    label:"Llama 3 8B",       tag:"fast"},
      {id:"mistralai/Mixtral-8x7B-Instruct-v0.1",label:"Mixtral 8x7B",  tag:""},
      {id:"Qwen/Qwen2-72B-Instruct",           label:"Qwen2 72B",        tag:""},
      {id:"deepseek-ai/deepseek-r1",           label:"DeepSeek R1",      tag:"reasoning"},
    ]
  },
  {
    id:"perplexity", name:"Perplexity", placeholder:"pplx-...", color:"#20b2aa", bg:"#0a2020", label:"PPX", group:"Other",
    defaultModel:"sonar-pro",
    models:[
      {id:"sonar-pro",         label:"Sonar Pro",       tag:"search"},
      {id:"sonar",             label:"Sonar",           tag:"fast"},
      {id:"sonar-reasoning",   label:"Sonar Reasoning", tag:"reasoning"},
    ]
  },
  {
    id:"huggingface", name:"Hugging Face", placeholder:"hf_...", color:"#ff9d00", bg:"#2e2000", label:"HF", group:"Other",
    defaultModel:"whoami (auth check)",
    models:[
      {id:"meta-llama/Meta-Llama-3-8B-Instruct", label:"Llama 3 8B",   tag:""},
      {id:"mistralai/Mistral-7B-Instruct-v0.3",  label:"Mistral 7B",   tag:""},
      {id:"google/gemma-2-9b-it",                label:"Gemma 2 9B",   tag:""},
    ]
  },
];

// track selected model per provider
const selectedModels = {};
PROVIDERS.forEach(p => { selectedModels[p.id] = p.defaultModel; });

const groups = [...new Set(PROVIDERS.map(p => p.group))];
const container = document.getElementById("cards");

groups.forEach(g => {
  const lbl = document.createElement("div");
  lbl.className = "section-label";
  lbl.textContent = g + " providers";
  container.appendChild(lbl);

  PROVIDERS.filter(p => p.group === g).forEach(p => {
    const card = document.createElement("div");
    card.className = "provider-card";
    card.id = `card-${p.id}`;

    const modelOpts = p.models.map(m => `
      <div class="model-opt${m.id === p.defaultModel ? ' selected' : ''}"
           data-id="${m.id}" onclick="selectModel('${p.id}','${m.id}',this)">
        <span>${m.label}</span>
        ${m.tag ? `<span class="opt-tag">${m.tag}</span>` : ''}
      </div>
    `).join('');

    card.innerHTML = `
      <div class="card-top">
        <div class="badge" style="background:${p.bg};color:${p.color}">${p.label}</div>
        <div><div class="pname">${p.name}</div></div>
      </div>

      <div class="model-row" id="mrow-${p.id}">
        <div class="model-trigger" id="mtrig-${p.id}" onclick="toggleDropdown('${p.id}')">
          <span style="color:var(--muted);font-size:10px">model:</span>
          <span class="model-label" id="mlabel-${p.id}">${p.defaultModel}</span>
          <span class="chevron">▾</span>
        </div>
        <div class="model-dropdown" id="mdrop-${p.id}">
          <div class="dropdown-list">${modelOpts}</div>
          <div class="dropdown-divider"></div>
          <div class="custom-model-row">
            <input class="custom-model-input" id="mcustom-${p.id}"
              placeholder="or type any model id…"
              onkeydown="if(event.key==='Enter'){applyCustomModel('${p.id}');event.stopPropagation()}"
            />
            <button class="btn-use-custom" onclick="applyCustomModel('${p.id}')">Use</button>
          </div>
        </div>
      </div>

      <div class="card-body">
        <input class="key-input" type="password" id="key-${p.id}" placeholder="${p.placeholder}"
          autocomplete="off" spellcheck="false"
          onkeydown="if(event.key==='Enter') checkKey('${p.id}')" />
        <button class="btn-vis" onclick="toggleVis('${p.id}')" title="show/hide">👁</button>
        <button class="btn-check" id="btn-${p.id}" onclick="checkKey('${p.id}')">Check</button>
      </div>
      <div class="card-status" id="status-${p.id}"></div>
    `;
    container.appendChild(card);
  });
});

// ── dropdown logic ────────────────────────────────────────────────────────────

let openDropdown = null;

function toggleDropdown(id) {
  const drop  = document.getElementById("mdrop-"+id);
  const trig  = document.getElementById("mtrig-"+id);
  const isOpen = drop.classList.contains("open");

  // close any other open dropdown
  if (openDropdown && openDropdown !== id) {
    document.getElementById("mdrop-"+openDropdown).classList.remove("open");
    document.getElementById("mtrig-"+openDropdown).classList.remove("open");
  }

  drop.classList.toggle("open", !isOpen);
  trig.classList.toggle("open", !isOpen);
  openDropdown = !isOpen ? id : null;

  if (!isOpen) {
    // pre-fill custom input with current model if it's not in preset list
    const p = PROVIDERS.find(x => x.id === id);
    const isPreset = p.models.some(m => m.id === selectedModels[id]);
    if (!isPreset) document.getElementById("mcustom-"+id).value = selectedModels[id];
  }
}

function selectModel(pid, modelId, el) {
  selectedModels[pid] = modelId;
  document.getElementById("mlabel-"+pid).textContent = modelId;
  // update selected highlight
  el.closest(".dropdown-list").querySelectorAll(".model-opt").forEach(o => o.classList.remove("selected"));
  el.classList.add("selected");
  // clear custom input
  document.getElementById("mcustom-"+pid).value = "";
  // close
  document.getElementById("mdrop-"+pid).classList.remove("open");
  document.getElementById("mtrig-"+pid).classList.remove("open");
  openDropdown = null;
}

function applyCustomModel(pid) {
  const val = document.getElementById("mcustom-"+pid).value.trim();
  if (!val) return;
  selectedModels[pid] = val;
  document.getElementById("mlabel-"+pid).textContent = val;
  // deselect all presets
  document.querySelectorAll(`#mdrop-${pid} .model-opt`).forEach(o => o.classList.remove("selected"));
  // close
  document.getElementById("mdrop-"+pid).classList.remove("open");
  document.getElementById("mtrig-"+pid).classList.remove("open");
  openDropdown = null;
}

// close dropdown on outside click
document.addEventListener("click", e => {
  if (!openDropdown) return;
  const row = document.getElementById("mrow-"+openDropdown);
  if (row && !row.contains(e.target)) {
    document.getElementById("mdrop-"+openDropdown).classList.remove("open");
    document.getElementById("mtrig-"+openDropdown).classList.remove("open");
    openDropdown = null;
  }
});

// ── key check ─────────────────────────────────────────────────────────────────

function toggleVis(id) {
  const inp = document.getElementById("key-"+id);
  inp.type = inp.type === "password" ? "text" : "password";
}

async function checkKey(id) {
  const key      = document.getElementById("key-"+id).value.trim();
  const model    = selectedModels[id];
  const statusEl = document.getElementById("status-"+id);
  const cardEl   = document.getElementById("card-"+id);
  const btn      = document.getElementById("btn-"+id);

  if (!key) { setStatus(statusEl, cardEl, "st-invalid", "⚠ enter a key first", "", 0); return; }

  btn.disabled = true;
  statusEl.className = "card-status st-checking";
  statusEl.innerHTML = `<span class="status-dot"></span><span class="status-text">checking with ${model}…</span>`;
  cardEl.className = "provider-card";

  try {
    const res  = await fetch("/api/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ provider: id, key, model })
    });
    const data = await res.json();

    if (data.valid === true)  setStatus(statusEl, cardEl, "st-valid",   data.reason, "",          data.latency_ms, "state-valid");
    else if (data.valid===null) setStatus(statusEl, cardEl, "st-warn",  data.reason, "",          data.latency_ms, "state-warn");
    else                      setStatus(statusEl, cardEl, "st-invalid", data.reason, data.detail, data.latency_ms, "state-invalid");
  } catch(e) {
    setStatus(statusEl, cardEl, "st-invalid", "network error — couldn't reach /api/check", e.message, 0, "state-invalid");
  }

  btn.disabled = false;
  updateSummary();
}

function setStatus(statusEl, cardEl, cls, msg, detail, latency, cardCls) {
  cardEl.className = "provider-card" + (cardCls ? " "+cardCls : "");
  let html = `<span class="status-dot"></span><span class="status-text">${msg}</span>`;
  if (latency) html += `<span class="latency">${latency}ms</span>`;
  statusEl.className = "card-status " + cls;
  statusEl.innerHTML = html;
  const existing = statusEl.nextElementSibling;
  if (existing && existing.classList.contains("detail-text")) existing.remove();
  if (detail) {
    const d = document.createElement("div");
    d.className = "detail-text";
    d.textContent = detail;
    statusEl.insertAdjacentElement("afterend", d);
  }
}

async function checkAll() {
  const filled = PROVIDERS.filter(p => document.getElementById("key-"+p.id).value.trim());
  if (!filled.length) return;
  await Promise.all(filled.map(p => checkKey(p.id)));
  updateSummary();
}

function clearAll() {
  PROVIDERS.forEach(p => {
    document.getElementById("key-"+p.id).value = "";
    const s = document.getElementById("status-"+p.id);
    s.className = "card-status"; s.innerHTML = "";
    document.getElementById("card-"+p.id).className = "provider-card";
    const d = s.nextElementSibling;
    if (d && d.classList.contains("detail-text")) d.remove();
  });
  document.getElementById("summary").style.display = "none";
}

function updateSummary() {
  let valid=0, invalid=0, waiting=0;
  PROVIDERS.forEach(p => {
    const s = document.getElementById("status-"+p.id);
    if (s.classList.contains("st-valid"))        valid++;
    else if (s.classList.contains("st-invalid") || s.classList.contains("st-warn")) invalid++;
    else waiting++;
  });
  const bar = document.getElementById("summary");
  bar.style.display = "flex";
  document.getElementById("sum-valid").textContent   = `${valid} valid`;
  document.getElementById("sum-invalid").textContent = `${invalid} invalid`;
  document.getElementById("sum-waiting").textContent = `${waiting} unchecked`;
}
</script>
